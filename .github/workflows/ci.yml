# Gate de qualidade: o PR só entra na main com estes checks verdes (ver CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  padrao:
    name: padrao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pre-commit==4.6.2
      # Mesmos hooks do commit local, só nos arquivos alterados: o legado converge sem travar ninguém.
      - name: pre-commit nos arquivos alterados
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pre-commit run --show-diff-on-failure --color=always --from-ref "$BASE" --to-ref HEAD

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install import-linter==2.15
      - name: camadas (backend/.importlinter)
        run: PYTHONPATH=. lint-imports
      # ponytail: testes ainda não entram no gate (8 falham na main). Corrigir a suíte e adicionar aqui o pytest.

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: build (inclui a checagem de tipos do TypeScript)
        run: npm run build
