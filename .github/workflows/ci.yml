# CI/CD do Tutor.
# CI: o PR só entra na main com padrao, backend e frontend verdes (ver CONTRIBUTING.md).
# CD: a cada merge na main, depois dos checks, o job deploy-alpha atualiza o ambiente alpha.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  padrao:
    name: padrao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pre-commit==4.6.2
      # Mesmos hooks do commit local, só nos arquivos alterados: o legado converge sem travar ninguém.
      - name: pre-commit nos arquivos alterados
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pre-commit run --show-diff-on-failure --color=always --from-ref "$BASE" --to-ref HEAD

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install import-linter==2.15
      - name: camadas (backend/.importlinter)
        run: PYTHONPATH=. lint-imports
      # ponytail: testes ainda não entram no gate (8 falham na main). Corrigir a suíte e adicionar aqui o pytest.

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: build (inclui a checagem de tipos do TypeScript)
        run: npm run build

  # Inativo até a VM do alpha existir: configure as variables ALPHA_HOST e ALPHA_USER (repositório)
  # e os secrets ALPHA_SSH_KEY e ALPHA_KNOWN_HOSTS (environment "alpha"). O servidor precisa do repo
  # clonado em ~/Tutor com o .env preenchido.
  # ponytail: build no próprio servidor; trocar por imagens num registry quando alpha, beta e
  # produção precisarem promover o mesmo artefato.
  deploy-alpha:
    name: deploy-alpha
    needs: [padrao, backend, frontend]
    if: github.event_name == 'push' && vars.ALPHA_HOST != ''
    runs-on: ubuntu-latest
    environment: alpha
    steps:
      - name: atualiza o alpha (git checkout do commit + docker compose)
        env:
          SSH_KEY: ${{ secrets.ALPHA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALPHA_KNOWN_HOSTS }}
          ALVO: ${{ vars.ALPHA_USER }}@${{ vars.ALPHA_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          install -m 600 /dev/null ~/.ssh/id_deploy && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy "$ALVO" \
            "cd ~/Tutor && git fetch -q origin && git checkout -q --detach $GITHUB_SHA && docker compose up -d --build"
